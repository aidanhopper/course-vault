services:
  course-vault:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-vault:latest
    container_name: course-vault
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # AI Provider (Google Gemini / OpenAI compatible)
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash-lite}

      # Storage paths on the NFS export (/srv/media/vault/{data, media})
      - VAULT_DATA_DIR=/srv/media/vault/data
      - MEDIA_DIR=/srv/media/vault/media
      - DATABASE_URL=sqlite+aiosqlite:////srv/media/vault/data/vault.db

      # Optional Jellyfin webhook for auto-library refresh
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
    volumes:
      # Mount the root /srv/media NFS export directly
      - nfs-storage:/srv/media

volumes:
  # Native Docker NFS Mount for /srv/media
  nfs-storage:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-192.168.0.86},rw,nfsvers=4"
      device: ":/srv/media"
