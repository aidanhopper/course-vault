services:
  course-vault:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-vault:latest
    container_name: course-vault
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # AI Provider (Google Gemini / OpenAI compatible)
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash-lite}

      # Storage paths inside container
      - VAULT_DATA_DIR=/data
      - MEDIA_DIR=/media
      - DATABASE_URL=sqlite+aiosqlite:////data/vault.db

      # Optional Jellyfin webhook for auto-library refresh
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
    volumes:
      # NFS Volumes for /srv/media export: /srv/media/vault/{data, media}
      - nfs-vault-data:/data
      - nfs-vault-media:/media

      # ---------------------------------------------------------------------
      # ALTERNATIVE: If /srv/media is already mounted on the Docker host OS,
      # comment out the nfs named volumes above and use direct host paths:
      # ---------------------------------------------------------------------
      # - /srv/media/vault/data:/data
      # - /srv/media/vault/media:/media

volumes:
  # Native Docker NFS Mount for /srv/media/vault/data
  nfs-vault-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-192.168.0.10},rw,sync,no_subtree_check"
      device: ":/srv/media/vault/data"

  # Native Docker NFS Mount for /srv/media/vault/media
  nfs-vault-media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:-192.168.0.10},rw,sync,no_subtree_check"
      device: ":/srv/media/vault/media"
