[project]
name = "course-platform"
version = "0.1.0"
description = "Course Vault — Self-hosted headless repository for course materials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
course-vault = "vault.main:run"
vault = "vault.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

